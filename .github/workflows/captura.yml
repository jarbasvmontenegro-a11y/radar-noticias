name: Captura de tela do site
# Roda sob demanda: abre o endereço num Chrome sem interface e guarda duas imagens (celular e computador) na branch captura-resultado.
on:
  workflow_dispatch:
    inputs:
      endereco:
        description: "Endereço a fotografar"
        default: "https://radarnoticias.top/"

permissions:
  contents: write

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ENDERECO: ${{ inputs.endereco }}
    steps:
      - name: Fotografar
        run: |
          set -eu
          case "$ENDERECO" in https://radarnoticias.top/*|https://www.radarnoticias.top/*|https://radar-noticias.pages.dev/*) ;; *) echo "endereço não permitido"; exit 1;; esac
          mkdir -p /tmp/res
          CH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          $CH --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=2 --virtual-time-budget=8000 --window-size=411,1000 --screenshot=/tmp/res/celular.png "$ENDERECO" || true
          $CH --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --window-size=1360,900 --screenshot=/tmp/res/computador.png "$ENDERECO" || true
          curl -sS -o /dev/null -w "http=%{http_code} ip=%{remote_ip}\n" --max-time 20 "$ENDERECO" | tee /tmp/res/resposta.txt
          ls -la /tmp/res
      - name: Guardar na branch captura-resultado
        if: always()
        run: |
          cd /tmp/res
          git init -q -b captura-resultado
          git config user.name radar-bot && git config user.email radar-bot@users.noreply.github.com
          git add -A && git commit -q -m "captura $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captura-resultado
