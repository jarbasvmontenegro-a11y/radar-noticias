name: Monitorar notícias

on:
  schedule:
    - cron: "7 * * * *"   # de hora em hora (minuto 7: evita o horário de pico do GitHub)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt

      # Código quebrado nunca chega ao ar: testes antes de qualquer coleta ou publicação.
      - name: Testes
        run: |
          python -m unittest discover -s tests
          node --test tests/functions.test.mjs tests/share.test.mjs tests/push.test.mjs tests/pote.test.mjs tests/extract.test.mjs tests/verify.test.mjs

      # Coleta é só RSS: sem IA e sem custo. Falha (e avisa) se nenhuma fonte responder.
      - name: Coletar notícias
        run: python -m radar collect

      # Assuntos do topo agrupados por IA: roda só duas vezes ao dia (8h e por volta das 17h, Brasília). Se falhar, o site usa o
      # agrupamento por palavras. Em execução manual, atualiza na hora.
      - name: Assuntos do topo por IA
        if: env.HAS_CLOUDFLARE == 'true' && vars.SITE_URL != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          RADAR_FORCAR_IA: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python -m radar destaques-ia

      - name: Houve novidade?
        id: changes
        run: |
          git add -f data/articles.json data/health.json
          if [ -f data/destaques_ia.json ]; then git add -f data/destaques_ia.json; fi
          if git diff --staged --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # esbuild só tira comentários e espaços do js/css publicados; se não instalar, o site sai sem minificar
      - name: Instalar minificador
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund --ignore-scripts esbuild@0.25.10

      - name: Gerar e verificar o site
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          python -m radar build | tee /tmp/build.log
          echo "::notice title=Minificação::$(grep -h minificar /tmp/build.log | head -1) | app.js=$(wc -c < site/app.js)B"
          python -m radar verify

      # Só guarda os dados depois que o site foi gerado e verificado com sucesso.
      - name: Guardar dados no repositório
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git commit -m "dados: $(date -u +%FT%TZ)" > /tmp/commit.log 2>&1 || { echo "::warning title=commit falhou::$(tr '\n' ' ' < /tmp/commit.log | cut -c1-900)"; exit 1; }
          for i in 1 2 3; do
            git push 2> /tmp/push.log && exit 0
            echo "::warning title=push falhou (tentativa $i)::$(tr '\n' ' ' < /tmp/push.log | cut -c1-900)"
            # outra execução guardou dados antes: descarta o commit local, refaz a coleta em cima dos dados mais novos
            cp data/destaques_ia.json /tmp/destaques_ia.json 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m radar collect
            cp /tmp/destaques_ia.json data/destaques_ia.json 2>/dev/null || true
            git add -f data/articles.json data/health.json
            if [ -f data/destaques_ia.json ]; then git add -f data/destaques_ia.json; fi
            git diff --staged --quiet && exit 0
            git commit -qm "dados: $(date -u +%FT%TZ)"
            sleep $((i * 5))
          done
          echo "não foi possível enviar os dados" >&2
          exit 1

      # Notificações: garante o segredo de envio no Pages antes da publicação (não faz nada se já existe; nunca derruba o fluxo).
      - name: Preparar notificações
        if: env.HAS_CLOUDFLARE == 'true' && (steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT || 'radar-noticias' }}
        run: node scripts/push_setup.mjs

      - name: Publicar no Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true' && (steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy site --project-name=${{ vars.CF_PROJECT || 'radar-noticias' }} --branch=main

      - name: Conferir se o site respondeu
        if: env.HAS_CLOUDFLARE == 'true' && vars.SITE_URL != '' && (steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          sleep 10
          curl -fsS --retry 4 --retry-delay 10 --max-time 20 "${{ vars.SITE_URL }}/" | grep -q "<title>"

      # Envia os avisos escolhidos por cada inscrito (só os assuntos mais cobertos). Falha aqui vira aviso, não erro.
      - name: Enviar notificações
        if: env.HAS_CLOUDFLARE == 'true' && vars.SITE_URL != '' && (steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/push_enviar.mjs

      # Alerta: abre uma issue (uma só) quando algo falha e fecha quando volta a funcionar.
      - name: Abrir alerta se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --label monitoramento --state open --json number --jq '.[0].number')" ]; then
            gh label create monitoramento --color B60205 --description "Falha no monitoramento" 2>/dev/null || true
            gh issue create --title "Falha no monitoramento de notícias" --label monitoramento \
              --body "O workflow falhou: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Fechar alerta se voltou ao normal
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label monitoramento --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Voltou a funcionar: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
