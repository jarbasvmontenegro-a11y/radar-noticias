name: Edição diária

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar, resumir e gerar o site
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL_CHEAP: ${{ vars.LLM_MODEL_CHEAP || 'deepseek-chat' }}
          LLM_MODEL_BEST: ${{ vars.LLM_MODEL_BEST || 'deepseek-chat' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m radar daily

      # O histórico (régua dos temas) vive no banco; guardamos o arquivo no próprio repositório.
      - name: Guardar o banco
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -f data/radar.db
          git diff --staged --quiet || git commit -m "dados: edição $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
