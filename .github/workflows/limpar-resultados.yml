name: Limpar resultados de diagnóstico
# Apaga as branches "auditoria" e "diagnostico" (resultados de testes de segurança e de fontes).
# Rode antes de tornar o repositório público.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apagar branches de resultado
        run: |
          for b in auditoria diagnostico; do
            git push origin --delete "$b" 2>/dev/null && echo "apagada: $b" || echo "não existe: $b"
          done
