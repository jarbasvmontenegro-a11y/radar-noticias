name: Diagnóstico
# Roda sob demanda. Testa feeds de notícias, APIs externas, o site no ar e prepara fontes.
# O resultado vai para a branch "diagnostico" (não mexe na main).
on:
  workflow_dispatch:
    inputs:
      publico:
        description: "Repositório público: digite sim para rodar (o resultado fica visível a todos na branch de resultados)"
        default: "nao"
      tarefa:
        description: "Qual diagnóstico rodar: feeds, apis, fontes, extracao, coleta ou tudo"
        default: "tudo"

permissions:
  contents: write

jobs:
  diagnostico:
    if: ${{ github.event.repository.private || inputs.publico == 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt fonttools brotli
      - run: mkdir -p diag

      - name: Feeds e sitemaps de notícias
        if: inputs.tarefa == 'feeds' || inputs.tarefa == 'tudo'
        continue-on-error: true
        run: python -m radar discover --out diag/probe.json --md diag/probe.md

      - name: APIs externas e site no ar
        if: inputs.tarefa == 'apis' || inputs.tarefa == 'tudo'
        continue-on-error: true
        run: python scripts/diagnostico_apis.py diag

      - name: Fontes (recorte para português)
        if: inputs.tarefa == 'fontes' || inputs.tarefa == 'tudo'
        continue-on-error: true
        run: python scripts/preparar_fontes.py diag/fonts

      - name: Ensaio de coleta (filtros e fontes)
        if: inputs.tarefa == 'coleta' || inputs.tarefa == 'tudo'
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python scripts/diagnostico_coleta.py diag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.tarefa == 'extracao' || inputs.tarefa == 'tudo'
        with:
          node-version: "22"

      - name: Leitura do texto das matérias
        if: inputs.tarefa == 'extracao' || inputs.tarefa == 'tudo'
        continue-on-error: true
        run: node scripts/diagnostico_extracao.mjs diag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.tarefa == 'texto'
        with:
          node-version: "22"

      - name: Texto lido de uma fonte (ver scripts/diagnostico_texto.mjs)
        if: inputs.tarefa == 'texto'
        continue-on-error: true
        run: node scripts/diagnostico_texto.mjs diag oeste 12

      - name: Guardar resultado na branch diagnostico
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          rm -rf /tmp/diag-out && cp -r diag /tmp/diag-out
          git checkout -q --orphan diagnostico
          git rm -rfq . || true
          git clean -fdxq
          cp -r /tmp/diag-out/. .
          git add -A
          git commit -qm "diagnóstico $(date -u +%FT%TZ)" --allow-empty
          git push -qf origin diagnostico
