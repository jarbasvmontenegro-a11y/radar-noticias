# Mantém as versões fixas (ações do GitHub por SHA e pacotes Python) atualizadas por pull request semanal.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # as etapas do CodeQL (init e analyze) PRECISAM ter a mesma versão: sobem juntas, no mesmo PR
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
