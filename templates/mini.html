<!doctype html>
<html lang="{{ cfg.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ cfg.site_url }}{{ path }}">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="stylesheet" href="{{ asset('mini.css') }}">
  <script>document.documentElement.className+=" js";try{var s=localStorage.getItem("radar-size");if(s)document.documentElement.dataset.size=s;var th=localStorage.getItem("radar-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
</head>
<body class="mini" data-mini="1">
  <div id="mini-root" class="m" role="main" aria-live="polite"><p class="m-msg">Carregando as últimas notícias.</p></div>
  <noscript><p class="m-msg">Esta janela precisa de JavaScript. As notícias estão em <a href="/">{{ cfg.name }}</a>.</p></noscript>
  <script src="{{ asset('mini.js') }}" defer></script>
</body>
</html>
